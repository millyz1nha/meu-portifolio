<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de Matrícula</title>
    <link rel="stylesheet" href="estilo1.css" />
  </head>

  <body>
    <h1>Matrícula no Curso</h1>

    <form id="formulario">
      <div>
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" required minlength="10" />
      </div>

      <div>
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" required />
      </div>

      <div>
        <label for="nascimento">Data de nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" required />
      </div>

      <div>
        <label>Sexo:</label>
        <input type="radio" name="sexo" value="Feminino" required /> Feminino
        <input type="radio" name="sexo" value="Masculino" /> Masculino
      </div>

      <div>
        <label for="arquivo">PDF ou Foto da Identidade:</label>
        <input type="file" id="arquivo" name="arquivo" required />
      </div>

      <div>
        <label for="curso">Idioma:</label>
        <select id="curso" name="curso" required>
          <option value="">Escolha</option>
          <option value="Inglês">Inglês</option>
          <option value="Espanhol">Espanhol</option>
          <option value="Francês">Francês</option>
          <option value="Japonês">Japonês</option>
        </select>
      </div>

      <div>
        <label for="turno">Turno:</label>
        <select id="turno" name="turno" required>
          <option value="">Escolha</option>
          <option value="Manhã">Manhã</option>
          <option value="Tarde">Tarde</option>
          <option value="Noite">Noite</option>
        </select>
      </div>

      <div>
        <label for="dia">Dias:</label>
        <select id="dia" name="dia" required>
          <option value="">Escolha</option>
          <option value="Segunda e Quarta">Segunda e Quarta</option>
          <option value="Terça e Quinta">Terça e Quinta</option>
          <option value="Sexta-feira">Sexta-feira</option>
        </select>
      </div>

      <div>
        <label for="celular">Celular:</label>
        <input type="text" id="celular" name="celular" required />
      </div>

      <div>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div>
        <label for="senha">Senha:</label>
        <input
          type="password"
          id="senha"
          name="senha"
          required
          minlength="6"
          maxlength="8"
        />
      </div>

      <div>
        <label for="confirmarSenha">Confirmar Senha:</label>
        <input type="password" id="confirmarSenha" required />
      </div>

      <div>
        <label>
          <input type="checkbox" name="newsletter" />
          Quero receber informações por e-mail
        </label>
      </div>

      <button type="submit">Enviar Dados</button>
    </form>
  </body>
</html>
