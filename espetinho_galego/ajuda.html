<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Ajuda - Espetinhos do Zé</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="menu-lateral">
        <img src="image/2.jpg" alt="Logo" class="logo" />
        <nav>
          <a href="loja.html">Voltar ao Início</a>
          <a href="precos.html " class="btn-precos">Cardápio</a>
          <a href="ajuda.html" class="btn-ajuda">Ajuda</a>
        </nav>
      </aside>

      <main class="conteudo">
        <section class="topo-precos">
          <h1 class="cardapio">Fale Conosco</h1>
          <p>Se tiver dúvidas, envie sua mensagem abaixo!</p>
        </section>

        <section class="formulario-box">
          <form class="formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required />

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required />

            <label for="mensagem">Mensagem:</label>
            <textarea
              id="mensagem"
              name="mensagem"
              rows="5"
              required
            ></textarea>

            <input type="submit" value="Enviar" class="botao" />
          </form>
        </section>
      </main>
    </div>

    <footer>
      <p>&copy; 2025 Churrasquinho do Galego</p>
    </footer>
  </body>
</html>
